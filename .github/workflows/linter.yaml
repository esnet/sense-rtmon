---
name: Linter

on:  # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  linter:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        # Actions pinned to commit SHAs: zizmor's unpinned-uses audit treats a
        # bare tag as an error, since tags are mutable and can be repointed.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          # Do not leave the token in .git/config for later steps to pick up.
          persist-credentials: false

      - name: Super-linter
        # Pinned deliberately. Tracking @latest means a super-linter release can
        # turn the pipeline red without any change to this repository.
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918  # v8.7.0
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_JSCPD: false
          # Use this repository's own pylint configuration, the same one linter.sh
          # runs locally. Without this super-linter applies stock pylint defaults,
          # so passing ./linter.sh told you nothing about whether CI would pass.
          LINTER_RULES_PATH: standarts
          PYTHON_PYLINT_CONFIG_FILE: pylintrc
          SPELL_CODESPELL_CONFIG_FILE: .codespellrc
          # linter.sh formats Python with 'pyink -l 200'. ruff format defaults to
          # 88 columns, so the two disagree on essentially every file and this
          # check can never go green. PYTHON_RUFF (the linter) stays enabled.
          VALIDATE_PYTHON_RUFF_FORMAT: false
          # src/templates holds exported Grafana dashboard JSON containing
          # REPLACEME placeholders. Reformatting vendored artifacts is churn, and
          # BIOME_LINT stays enabled to still catch genuinely malformed JSON.
          VALIDATE_BIOME_FORMAT: false
          # Matched against the in-container absolute path, so it needs the
          # leading wildcard.
          FILTER_REGEX_EXCLUDE: .*/autogole-api/src/templates/.*
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
