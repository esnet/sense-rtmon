[program:rtmon_daemon]
command=bash -c " sleep 5 && RTMon-Daemon --action start"
priority=-1
stdout_logfile=/var/log/rtmon/daemon.log
stdout_logfile_maxbytes=0
redirect_stderr=true

; (Archify rendering and serving happen in a sidecar container,
; which is part of the same pod, so there is no program for them here. RTMon is
; only an HTTP client of it - see archify.sidecar_url in rtmon.yaml. Note the
; sidecar listens on 8081, because rtmon_http in 20-http.conf has 8080 and
; containers in one pod share a network namespace.)
